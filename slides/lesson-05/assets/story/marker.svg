<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" ><defs><marker id="1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker><marker id="dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><marker id="15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker><marker id="b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1000" height="380" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><rect x="35.0" y="85" width="250" height="125" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="160.0" y="138.18" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">先保存</text><text x="160.0" y="175.18" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">本进程的局部状态</text><path d="M290.0 148L369.0 148" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#1d4ed8)"/><text x="330.0" y="66" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="400">随后</text><rect x="375.0" y="85" width="250" height="125" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="500.0" y="138.18" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">再传播 Marker</text><text x="500.0" y="175.18" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">给输出通道划边界</text><path d="M630.0 148L709.0 148" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#1d4ed8)"/><text x="670.0" y="66" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="400">同时</text><rect x="715.0" y="85" width="250" height="125" rx="5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/><text x="840.0" y="138.18" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">记录其他输入</text><text x="840.0" y="175.18" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">直到该通道标记到达</text><text x="500" y="300" font-size="27" fill="#1d4ed8" text-anchor="middle" font-weight="400">可靠 FIFO 通道：同一通道中，标记不会越过先发出的消息。</text></g></svg>