<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" ><defs><marker id="1d4ed8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#1d4ed8"/></marker><marker id="dc2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#dc2626"/></marker><marker id="15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker><marker id="b45309" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker><marker id="64748b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1000" height="420" fill="white"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="25" y="40" font-size="30" fill="#1d4ed8" text-anchor="start" font-weight="400">每次写 200 MB；存储可持续写入 50 MB/s</text><path d="M80 130L920 130" fill="none" stroke="#1d4ed8" stroke-width="3" marker-end="url(#1d4ed8)"/><text x="500.0" y="117.0" font-size="24" fill="#1d4ed8" text-anchor="middle" font-weight="400">每次至少需要 4 秒</text><path d="M80 110L80 150" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M280 110L280 150" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M480 110L480 150" fill="none" stroke="#1d4ed8" stroke-width="3"/><path d="M680 110L680 150" fill="none" stroke="#1d4ed8" stroke-width="3"/><text x="80" y="195" font-size="28" fill="#20242a" text-anchor="start" font-weight="400">若每 2 秒发起一次：</text><text x="80" y="250" font-size="34" fill="#dc2626" text-anchor="start" font-weight="400">写入需求 = 200 MB ÷ 2 s = 100 MB/s</text><text x="80" y="320" font-size="31" fill="#dc2626" text-anchor="start" font-weight="400">100 MB/s &gt; 50 MB/s：写入任务持续积压</text><text x="80" y="385" font-size="28" fill="#1d4ed8" text-anchor="start" font-weight="400">优先减少快照量、降低频率，或提高存储吞吐。</text></g></svg>