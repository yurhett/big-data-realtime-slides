name: Build and deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out slides
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update easy-slides from its default branch
        run: pnpm update @easy-slides/cli

      - name: Install Chromium for rendered slide checks
        run: pnpm exec easy-slides install-browser --with-deps

      - name: Build slides
        run: pnpm build
        env:
          PRESENTER_TOKEN: ${{ secrets.PRESENTER_TOKEN }}

      - name: Deploy production site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler pages deploy dist --project-name=big-data-realtime-slides --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
